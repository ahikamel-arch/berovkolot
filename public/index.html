<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>משחק ברוב קולות - חדרים</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
      text-align: center;
      direction: rtl;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 500px;
      margin: 20px auto;
    }
    input, button {
      width: 90%;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background-color: #0056b3; }
    .btn-success { background-color: #28a745; }
    .btn-danger { background-color: #dc3545; }
    .hidden { display: none; }
    .player-btn {
      display: block;
      width: 100%;
      background: #f8f9fa;
      color: #333;
      border: 2px solid #007bff;
      margin: 5px 0;
    }
    .pending-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #e9ecef;
      padding: 8px 12px;
      margin: 5px 0;
      border-radius: 6px;
    }
    .pending-item button {
      width: auto;
      margin: 0 4px;
      padding: 6px 12px;
    }
  </style>
</head>
<body>

  <!-- מסך כניסה: יצירה או הצטרפות -->
  <div id="screen-entry" class="card">
    <h2>ברוכים הבאים למשחק!</h2>
    <input type="text" id="player-name" placeholder="השם שלך">
    <input type="text" id="room-id" placeholder="שם החדר (למשל: family123)">
    
    <button onclick="createRoom()" class="btn-success">צור חדר חדש (כמנהל)</button>
    <button onclick="joinRoom()">הצטרף לחדר קיים</button>
    <p id="entry-error" style="color:red;"></p>
  </div>

  <!-- מסך המתנה לאישור המנהל -->
  <div id="screen-waiting" class="card hidden">
    <h2>ממתין לאישור המנהל...</h2>
    <p>בקשת ההצטרפות שלך נשלחה למנהל החדר.</p>
  </div>

  <!-- פאנל ניהול ממתינים (מוצג רק למנהל) -->
  <div id="admin-approval-panel" class="card hidden">
    <h3>בקשות הצטרפות לחדר:</h3>
    <div id="pending-list">אין בקשות ממתינות</div>
  </div>

  <!-- מסך המשחק הפעיל -->
  <div id="screen-game" class="card hidden">
    <h3 id="room-title"></h3>
    <p id="q-progress"></p>
    <h2 id="question-text">ממתין לתחילת המשחק...</h2>
    
    <div id="voting-options"></div>

    <div id="host-controls" class="hidden" style="margin-top: 20px;">
      <button onclick="nextQuestion()" class="btn-success">השאלה הבאה ➔</button>
      <button onclick="restartGame()" class="btn-danger">התחל משחק מחדש</button>
    </div>

    <hr>
    <h3>טבלת מובילים:</h3>
    <ul id="players-list" style="list-style: none; padding: 0;"></ul>
  </div>

  <script>
    const socket = io();
    let currentRoom = '';
    let isHost = false;

    function createRoom() {
      const name = document.getElementById('player-name').value.trim();
      const room = document.getElementById('room-id').value.trim();
      if (!name || !room) return alert('נא למלא שם ושם חדר');

      socket.emit('create_room', { roomId: room, hostName: name });
    }

    function joinRoom() {
      const name = document.getElementById('player-name').value.trim();
      const room = document.getElementById('room-id').value.trim();
      if (!name || !room) return alert('נא למלא שם ושם חדר');

      socket.emit('join_room_request', { roomId: room, playerName: name });
    }

    // תגובות מהשרת
    socket.on('room_created', (data) => {
      currentRoom = data.roomId;
      isHost = data.isHost;
      showGameScreen();
    });

    socket.on('waiting_for_approval', () => {
      document.getElementById('screen-entry').classList.add('hidden');
      document.getElementById('screen-waiting').classList.remove('hidden');
    });

    socket.on('join_approved', (data) => {
      currentRoom = data.roomId;
      isHost = false;
      document.getElementById('screen-waiting').classList.add('hidden');
      showGameScreen();
    });

    socket.on('join_rejected', (msg) => {
      alert(msg);
      location.reload();
    });

    socket.on('room_error', (msg) => {
      document.getElementById('entry-error').innerText = msg;
    });

    socket.on('pending_players_update', (pendingList) => {
      if (!isHost) return;
      const panel = document.getElementById('admin-approval-panel');
      const listContainer = document.getElementById('pending-list');

      if (pendingList.length > 0) {
        panel.classList.remove('hidden');
        listContainer.innerHTML = pendingList.map(p => `
          <div class="pending-item">
            <span>${p.name}</span>
            <div>
              <button onclick="approve('${p.id}')" class="btn-success">אשר</button>
              <button onclick="reject('${p.id}')" class="btn-danger">דחה</button>
            </div>
          </div>
        `).join('');
      } else {
        panel.classList.add('hidden');
      }
    });

    function approve(id) { socket.emit('approve_player', id); }
    function reject(id) { socket.emit('reject_player', id); }

    function showGameScreen() {
      document.getElementById('screen-entry').classList.add('hidden');
      document.getElementById('screen-game').classList.remove('hidden');
      document.getElementById('room-title').innerText = `חדר: ${currentRoom}`;
      if (isHost) {
        document.getElementById('host-controls').classList.remove('hidden');
      }
    }

    socket.on('update_players', (players) => {
      const list = document.getElementById('players-list');
      list.innerHTML = players.map(p => 
        `<li>${p.name} - ${p.score} נקודות ${p.hasVoted ? '✅' : ''}</li>`
      ).join('');

      // עדכון כפתורי ההצבעה לפי השחקנים שבחדר
      const options = document.getElementById('voting-options');
      options.innerHTML = players.map(p => 
        `<button class="player-btn" onclick="vote('${p.name}')">${p.name}</button>`
      ).join('');
    });

    socket.on('new_question', (data) => {
      document.getElementById('q-progress').innerText = `שאלה ${data.qIndex} מתוך ${data.total}`;
      document.getElementById('question-text').innerText = data.question.text;
    });

    function vote(candidateName) {
      socket.emit('submit_vote', candidateName);
    }

    function nextQuestion() {
      socket.emit('next_question');
    }

    function restartGame() {
      socket.emit('restart_game');
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>משחק ברוב קולות</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      direction: rtl;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 550px;
      width: 100%;
      text-align: center;
    }
    h1, h2, h3 { color: #333; margin-top: 0; }
    input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ddd;
      outline: none;
    }
    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
    }
    .btn-primary { background-color: #007bff; color: white; }
    .btn-primary:hover { background-color: #0056b3; }
    .btn-success { background-color: #28a745; color: white; }
    .btn-success:hover { background-color: #218838; }
    .btn-danger { background-color: #dc3545; color: white; }
    .btn-danger:hover { background-color: #c82333; }

    .hidden { display: none !important; }

    .players-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 15px 0;
    }
    .vote-btn {
      background: #f8f9fa;
      color: #333;
      border: 2px solid #007bff;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
    }
    .vote-btn:hover { background: #007bff; color: white; }
    .vote-btn.selected { background: #28a745; color: white; border-color: #218838; }
    .vote-btn:disabled { cursor: default; }

    .rooms-list {
      margin: 15px 0;
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 5px;
    }
    .room-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8f9fa;
      padding: 10px 15px;
      margin: 5px 0;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #ddd;
    }
    .room-item:hover { background: #e2e6ea; }

    .pending-box {
      background: #fff3cd;
      border: 1px solid #ffeeba;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .pending-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0;
    }
    .pending-item button { width: auto; padding: 6px 12px; margin: 0 4px; }

    .results-box {
      background: #e9ecef;
      padding: 15px;
      border-radius: 8px;
      margin: 15px 0;
    }
    .leaderboard {
      list-style: none;
      padding: 0;
      margin: 15px 0;
    }
    .leaderboard li {
      background: #f8f9fa;
      padding: 10px 15px;
      margin: 5px 0;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- מסך כניסה -->
  <div id="screen-entry" class="card">
    <h1>🏆 ברוב קולות</h1>
    <input type="text" id="player-name" placeholder="הכנס את השם שלך" maxlength="20">

    <div style="margin-top: 20px;">
      <h3>צור חדר חדש</h3>
      <input type="text" id="new-room-id" placeholder="שם החדר ליצירה" maxlength="20">
      <button onclick="createRoom()" class="btn-success">צור חדר כמנהל</button>
    </div>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">

    <div>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="margin:0;">חדרים פעילים:</h3>
        <button onclick="requestRooms()" class="btn-primary" style="width: auto; padding: 4px 10px; margin: 0; font-size: 13px;">🔄 רענן</button>
      </div>
      <div id="rooms-container" class="rooms-list">
        <p style="color: #6c757d;">מחפש חדרים...</p>
      </div>
    </div>

    <p id="entry-error" style="color:red; font-weight: bold; margin-top: 10px;"></p>
  </div>

  <!-- מסך המתנה לאישור -->
  <div id="screen-waiting" class="card hidden">
    <h2>⏳ ממתין לאישור המנהל...</h2>
    <p>בקשת ההצטרפות שלך נשלחה למנהל החדר.</p>
  </div>

  <!-- מסך המשחק -->
  <div id="screen-game" class="card hidden">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span id="room-title" style="font-weight: bold; color: #555;"></span>
      <span id="q-progress" style="font-weight: bold; color: #007bff;"></span>
    </div>

    <!-- פאנל אישור שחקנים ממתינים למנהל -->
    <div id="admin-approval-panel" class="pending-box hidden">
      <h4 style="margin: 0 0 10px 0;">🔔 בקשות הצטרפות:</h4>
      <div id="pending-list"></div>
    </div>

    <h2 id="question-text" style="margin: 20px 0; min-height: 60px;">ממתין לתחילת המשחק...</h2>

    <!-- אזור הבחירה / הצבעה -->
    <div id="voting-area">
      <div id="voting-options" class="players-grid"></div>
      <p id="vote-status" style="color: #6c757d; font-weight: bold;"></p>
    </div>

    <!-- מסך תוצאות השאלה -->
    <div id="results-area" class="results-box hidden">
      <h3 id="winner-title"></h3>
      <div id="votes-breakdown" style="text-align: right; margin-top: 10px;"></div>
    </div>

    <!-- בקרות מנהל -->
    <div id="host-controls" class="hidden" style="margin-top: 20px;">
      <button id="next-q-btn" onclick="nextQuestion()" class="btn-success">התחל / השאלה הבאה ➔</button>
      <button onclick="restartGame()" class="btn-danger">התחל משחק מחדש</button>
    </div>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">
    <h3 style="margin-bottom: 10px;">🏆 טבלת מובילים:</h3>
    <ul id="players-list" class="leaderboard"></ul>
  </div>

  <script>
    const socket = io();
    let currentRoom = '';
    let isHost = false;
    let myName = '';
    let hasVotedThisRound = false;
    let roundActive = false; // האם יש כרגע שאלה פתוחה להצבעה

    socket.on('connect', () => {
      requestRooms();
    });

    function requestRooms() {
      socket.emit('get_rooms');
    }

    socket.on('rooms_list_update', (roomsList) => {
      const container = document.getElementById('rooms-container');
      container.innerHTML = '';

      if (!roomsList || roomsList.length === 0) {
        const p = document.createElement('p');
        p.style.color = '#6c757d';
        p.innerText = 'אין חדרים פעילים כרגע';
        container.appendChild(p);
        return;
      }

      roomsList.forEach(r => {
        const item = document.createElement('div');
        item.className = 'room-item';

        const nameSpan = document.createElement('span');
        nameSpan.innerText = '🏠 ' + r.id;
        nameSpan.style.fontWeight = 'bold';

        const countSpan = document.createElement('span');
        countSpan.style.fontSize = '14px';
        countSpan.style.color = '#555';
        countSpan.innerText = '👥 ' + r.count + ' שחקנים';

        item.appendChild(nameSpan);
        item.appendChild(countSpan);
        item.onclick = () => selectAndJoinRoom(r.id);
        container.appendChild(item);
      });
    });

    function createRoom() {
      myName = document.getElementById('player-name').value.trim();
      const room = document.getElementById('new-room-id').value.trim();
      if (!myName) return alert('נא להזין את השם שלך');
      if (!room) return alert('נא להזין שם לחדר');

      socket.emit('create_room', { roomId: room, hostName: myName });
    }

    function selectAndJoinRoom(roomId) {
      myName = document.getElementById('player-name').value.trim();
      if (!myName) return alert('נא להזין את השם שלך קודם');

      socket.emit('join_room_request', { roomId: roomId, playerName: myName });
    }

    socket.on('room_created', (data) => {
      currentRoom = data.roomId;
      isHost = data.isHost;
      showGameScreen();
    });

    socket.on('waiting_for_approval', () => {
      document.getElementById('screen-entry').classList.add('hidden');
      document.getElementById('screen-waiting').classList.remove('hidden');
    });

    socket.on('join_approved', (data) => {
      currentRoom = data.roomId;
      isHost = false;
      document.getElementById('screen-waiting').classList.add('hidden');
      showGameScreen();
    });

    socket.on('join_rejected', (msg) => {
      alert(msg);
      location.reload();
    });

    socket.on('room_error', (msg) => {
      document.getElementById('entry-error').innerText = msg;
    });

    // אם המנהל המקורי עזב והשרת מינה אותנו כמנהל חדש
    socket.on('host_status', (status) => {
      isHost = status;
      updateHostUI();
    });

    function updateHostUI() {
      const controls = document.getElementById('host-controls');
      if (isHost) {
        controls.classList.remove('hidden');
      } else {
        controls.classList.add('hidden');
        document.getElementById('admin-approval-panel').classList.add('hidden');
      }
    }

    socket.on('pending_players_update', (pendingList) => {
      if (!isHost) return;
      const panel = document.getElementById('admin-approval-panel');
      const listContainer = document.getElementById('pending-list');
      listContainer.innerHTML = '';

      if (pendingList.length > 0) {
        panel.classList.remove('hidden');
        pendingList.forEach(p => {
          const row = document.createElement('div');
          row.className = 'pending-item';

          const nameSpan = document.createElement('span');
          nameSpan.style.fontWeight = 'bold';
          nameSpan.innerText = p.name;

          const btnWrap = document.createElement('div');
          const approveBtn = document.createElement('button');
          approveBtn.className = 'btn-success';
          approveBtn.innerText = 'אשר';
          approveBtn.onclick = () => socket.emit('approve_player', p.id);

          const rejectBtn = document.createElement('button');
          rejectBtn.className = 'btn-danger';
          rejectBtn.innerText = 'דחה';
          rejectBtn.onclick = () => socket.emit('reject_player', p.id);

          btnWrap.appendChild(approveBtn);
          btnWrap.appendChild(rejectBtn);
          row.appendChild(nameSpan);
          row.appendChild(btnWrap);
          listContainer.appendChild(row);
        });
      } else {
        panel.classList.add('hidden');
      }
    });

    function showGameScreen() {
      document.getElementById('screen-entry').classList.add('hidden');
      document.getElementById('screen-game').classList.remove('hidden');
      document.getElementById('room-title').innerText = 'חדר: ' + currentRoom;
      updateHostUI();
    }

    function renderVotingButtons(players) {
      const options = document.getElementById('voting-options');
      options.innerHTML = '';
      players.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'vote-btn';
        btn.innerText = p.name;
        btn.onclick = () => vote(p.name, btn);
        options.appendChild(btn);
      });
    }

    socket.on('update_players', (players) => {
      const list = document.getElementById('players-list');
      list.innerHTML = '';
      players.forEach(p => {
        const li = document.createElement('li');
        const nameSpan = document.createElement('span');
        nameSpan.innerText = p.name + (p.isHost ? ' 👑' : '');
        const scoreSpan = document.createElement('span');
        scoreSpan.innerText = p.score + " נק' " + (p.hasVoted ? '✅' : '⏳');
        li.appendChild(nameSpan);
        li.appendChild(scoreSpan);
        list.appendChild(li);
      });

      // מרעננים את כפתורי ההצבעה רק אם יש שאלה פעילה ועוד לא הצבענו
      // (כדי שלא יופיעו כפתורי הצבעה בלובי לפני שהמשחק התחיל)
      if (roundActive && !hasVotedThisRound) {
        renderVotingButtons(players);
      }
    });

    socket.on('new_question', (data) => {
      hasVotedThisRound = false;
      roundActive = true;

      document.getElementById('results-area').classList.add('hidden');
      document.getElementById('voting-area').classList.remove('hidden');
      document.getElementById('vote-status').innerText = '';

      document.getElementById('q-progress').innerText = 'שאלה ' + data.qIndex + '/' + data.total;
      document.getElementById('question-text').innerText = data.question.text;

      renderVotingButtons(data.players);
    });

    socket.on('vote_progress', (data) => {
      document.getElementById('vote-status').innerText = 'הצביעו ' + data.votedCount + ' מתוך ' + data.total + ' שחקנים';
    });

    function vote(candidateName, clickedBtn) {
      if (hasVotedThisRound || !roundActive) return;
      hasVotedThisRound = true;
      socket.emit('submit_vote', candidateName);

      const buttons = document.querySelectorAll('.vote-btn');
      buttons.forEach(btn => {
        if (btn === clickedBtn) {
          btn.classList.add('selected');
          btn.style.opacity = '1';
        } else {
          btn.style.opacity = '0.5';
        }
        btn.disabled = true;
      });
    }

    socket.on('show_results', (data) => {
      roundActive = false;
      document.getElementById('voting-area').classList.add('hidden');
      const resultsArea = document.getElementById('results-area');
      resultsArea.classList.remove('hidden');

      const title = document.getElementById('winner-title');
      if (data.isTie) {
        title.innerText = '🤝 יש תיקו! אין ניקוד בתיקו.';
      } else {
        title.innerText = '🎉 הרוב קבע: ' + data.winningVote + '!';
      }

      const breakdown = document.getElementById('votes-breakdown');
      breakdown.innerHTML = '';
      const bTitle = document.createElement('b');
      bTitle.innerText = 'תפזורת ההצבעות:';
      breakdown.appendChild(bTitle);
      const ul = document.createElement('ul');
      ul.style.paddingRight = '20px';
      for (const [name, count] of Object.entries(data.votesCount)) {
        const li = document.createElement('li');
        li.innerText = name + ': ' + count + ' קולות';
        ul.appendChild(li);
      }
      breakdown.appendChild(ul);

      if (data.playersList) {
        const list = document.getElementById('players-list');
        list.innerHTML = '';
        data.playersList.forEach(p => {
          const li = document.createElement('li');
          const nameSpan = document.createElement('span');
          nameSpan.innerText = p.name + (p.isHost ? ' 👑' : '');
          const scoreSpan = document.createElement('span');
          scoreSpan.innerText = p.score + " נק'";
          li.appendChild(nameSpan);
          li.appendChild(scoreSpan);
          list.appendChild(li);
        });
      }
    });

    socket.on('game_over', (data) => {
      roundActive = false;
      document.getElementById('voting-area').classList.add('hidden');
      const resultsArea = document.getElementById('results-area');
      resultsArea.classList.remove('hidden');
      document.getElementById('winner-title').innerText = '🏆 המשחק הסתיים! המנצח/ת: ' + data.winner.name + '!';
      document.getElementById('votes-breakdown').innerHTML = '';
    });

    function nextQuestion() {
      socket.emit('next_question', { roomId: currentRoom });
    }

    function restartGame() {
      socket.emit('restart_game', { roomId: currentRoom });
    }
  </script>
</body>
</html>
